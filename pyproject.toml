[project]
name = "soil-moisture-trio"
version = "0.1.0"
description = "Rule-based drought risk monitoring pipeline for Australian soil moisture, heat, and VPD stress."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.16.0",
    "geopandas>=1.1.3",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    "netcdf4>=1.7.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "rioxarray>=0.15.0",
    "scipy>=1.11.0",
    "shapely>=2.0.0",
    "weather-tools @ git+https://github.com/harryeslick/weather_tools.git@1089eaa015e59cbd496e11498a26c862e98e1bf9",
    "xarray>=2024.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:numpy.ndarray size changed, may indicate binary incompatibility\\..*:RuntimeWarning",
]
